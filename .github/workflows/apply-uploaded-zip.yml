name: Replace project and build APK

on:
  workflow_dispatch:

permissions:
  contents: write

env:
  JAVA_VERSION: '17'

jobs:
  replace-and-build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout master
        uses: actions/checkout@v4
        with:
          ref: master
          fetch-depth: 0

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Decode uploaded project
        shell: bash
        run: |
          set -euo pipefail
          test -f project-update.ready
          cat project-update.part*.b64 | base64 --decode > /tmp/socialhub-update.tar.gz
          rm -rf /tmp/socialhub-update
          mkdir -p /tmp/socialhub-update
          tar -xzf /tmp/socialhub-update.tar.gz -C /tmp/socialhub-update
          test -f /tmp/socialhub-update/app/build.gradle.kts

      - name: Replace old project files
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import re
          import shutil
          import subprocess

          root = Path('.')
          update = Path('/tmp/socialhub-update')

          preserved = {
              '.github/workflows/build-apk.yml',
              '.github/workflows/apply-uploaded-zip.yml',
              'gradle/wrapper/gradle-wrapper.jar',
              'app/src/main/res/mipmap-hdpi/ic_launcher.webp',
              'app/src/main/res/mipmap-hdpi/ic_launcher_round.webp',
              'app/src/main/res/mipmap-mdpi/ic_launcher.webp',
              'app/src/main/res/mipmap-mdpi/ic_launcher_round.webp',
              'app/src/main/res/mipmap-xhdpi/ic_launcher.webp',
              'app/src/main/res/mipmap-xhdpi/ic_launcher_round.webp',
              'app/src/main/res/mipmap-xxhdpi/ic_launcher.webp',
              'app/src/main/res/mipmap-xxhdpi/ic_launcher_round.webp',
              'app/src/main/res/mipmap-xxxhdpi/ic_launcher.webp',
              'app/src/main/res/mipmap-xxxhdpi/ic_launcher_round.webp',
              'app/src/test/screenshots/greeting.png',
          }

          tracked = subprocess.check_output(['git', 'ls-files', '-z']).decode().split('\0')
          for rel in tracked:
              if not rel or rel in preserved or rel.startswith('project-update.part') or rel == 'project-update.ready':
                  continue
              p = root / rel
              if p.is_file() or p.is_symlink():
                  p.unlink(missing_ok=True)

          for source in update.rglob('*'):
              if source.is_dir():
                  continue
              rel = source.relative_to(update).as_posix()
              if rel in preserved:
                  continue
              target = root / rel
              target.parent.mkdir(parents=True, exist_ok=True)
              shutil.copy2(source, target)

          gradle_file = root / 'app/build.gradle.kts'
          text = gradle_file.read_text()
          text = re.sub(
              r'\n\s*create\("debugConfig"\)\s*\{.*?\n\s*\}',
              '',
              text,
              flags=re.S,
          )
          text = text.replace(
              'debug { signingConfig = signingConfigs.getByName("debugConfig") }',
              'debug { isDebuggable = true }',
          )
          gradle_file.write_text(text)

          for temp in root.glob('project-update.part*.b64'):
              temp.unlink(missing_ok=True)
          (root / 'project-update.ready').unlink(missing_ok=True)
          PY

      - name: Create environment file
        run: echo "GEMINI_API_KEY=${{ secrets.GEMINI_API_KEY }}" > .env

      - name: Build debug APK
        shell: bash
        run: |
          chmod +x ./gradlew
          ./gradlew assembleDebug --stacktrace --no-daemon

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: SocialHub-debug
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error

      - name: Commit replaced project
        shell: bash
        run: |
          set -euo pipefail
          rm -f .github/workflows/apply-uploaded-zip.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Replace Social Hub project from uploaded ZIP"
          git push origin HEAD:master
