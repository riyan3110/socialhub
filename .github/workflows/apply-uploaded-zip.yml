name: Apply uploaded project ZIP

on:
  push:
    branches:
      - master
    paths:
      - project-update.ready

permissions:
  contents: write

jobs:
  apply-update:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Decode project update
        shell: bash
        run: |
          cat project-update.part*.b64 | base64 --decode > /tmp/socialhub-update.tar.gz
          mkdir -p /tmp/socialhub-update
          tar -xzf /tmp/socialhub-update.tar.gz -C /tmp/socialhub-update

      - name: Replace project files safely
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import shutil
          import subprocess

          root = Path('.')
          update = Path('/tmp/socialhub-update')

          preserve = {
              '.github/workflows/build-apk.yml',
              '.github/workflows/apply-uploaded-zip.yml',
              'project-update.ready',
              'gradle/wrapper/gradle-wrapper.jar',
              'app/src/main/res/mipmap-hdpi/ic_launcher.webp',
              'app/src/main/res/mipmap-hdpi/ic_launcher_round.webp',
              'app/src/main/res/mipmap-mdpi/ic_launcher.webp',
              'app/src/main/res/mipmap-mdpi/ic_launcher_round.webp',
              'app/src/main/res/mipmap-xhdpi/ic_launcher.webp',
              'app/src/main/res/mipmap-xhdpi/ic_launcher_round.webp',
              'app/src/main/res/mipmap-xxhdpi/ic_launcher.webp',
              'app/src/main/res/mipmap-xxhdpi/ic_launcher_round.webp',
              'app/src/main/res/mipmap-xxxhdpi/ic_launcher.webp',
              'app/src/main/res/mipmap-xxxhdpi/ic_launcher_round.webp',
              'app/src/test/screenshots/greeting.png',
          }

          tracked = subprocess.check_output(['git', 'ls-files', '-z']).decode().split('\0')
          for rel in tracked:
              if not rel or rel in preserve or rel.startswith('project-update.part'):
                  continue
              p = root / rel
              if p.is_file() or p.is_symlink():
                  p.unlink(missing_ok=True)

          for source in update.rglob('*'):
              if source.is_dir():
                  continue
              rel = source.relative_to(update)
              target = root / rel
              target.parent.mkdir(parents=True, exist_ok=True)
              shutil.copy2(source, target)

          for temp in root.glob('project-update.part*.b64'):
              temp.unlink(missing_ok=True)
          (root / 'project-update.ready').unlink(missing_ok=True)
          (root / '.github/workflows/apply-uploaded-zip.yml').unlink(missing_ok=True)
          PY

      - name: Commit replaced project
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Replace project files from uploaded Social Hub ZIP"
          git push origin HEAD:master
